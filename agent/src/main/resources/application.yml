spring:
  application:
    name: nottrilix-agent
  ai:
    openai:
      # Key from the environment (the script reads it from openai.key). Without it the agent starts but returns 503.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o           # the agent's model (tool calling + Croatian)
          temperature: 0.2
      # Phase 5, voice: speech-to-text (STT) is OpenAI, text-to-speech (TTS) is ElevenLabs if it has a key, else OpenAI
      audio:
        transcription:
          options:
            model: gpt-4o-mini-transcribe
            language: hr
            # Without a prompt the model can ignore language and return Cyrillic or Polish; domain vocabulary fixes it.
            prompt: >-
              Razgovor kupca s podrškom NotTrilix na hrvatskom. Pojmovi: HT bon, A1 bon, Steam Wallet, PlayStation Store,
              Xbox Gift Card, wallet, aktivacijski kod, serijski broj, kupnja, povrat, blokada bona, potvrđujem, odustajem.
        speech:
          options:
            model: gpt-4o-mini-tts
            voice: nova
            response-format: mp3
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:not-set}
      tts:
        options:
          model-id: eleven_multilingual_v2
          voice-id: ${NOTTRILIX_VOICE_ID:CwhRBWXzGAHq8TQ4Fs17}
          output-format: mp3_44100_64
    model:
      embedding: none             # no embeddings in the agent: the system searches the knowledge base (MCP tool)
      audio:
        speech: ${NOTTRILIX_TTS:openai}   # elevenlabs | openai (the script picks elevenlabs when elevenlabs.key exists)
    # The agent is the system's MCP client: tools and knowledge come over the wire (HTTP, no session)
    mcp:
      client:
        name: nottrilix-agent
        version: 0.4.0
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            nottrilix:
              url: ${NOTTRILIX_SYSTEM_URL:http://localhost:8080}
              endpoint: /mcp
  output:
    ansi:
      enabled: always

server:
  port: 8090

nottrilix:
  voice:
    enabled: true
    max-reply-chars: 600          # a longer reply is cut for speech (chat still gets the full text)
  agent:
    name: Nola
    max-history-messages: 20      # how many recent conversation messages the model sees
    # Key the agent presents to the system when connecting. Demo value; the system must hold the same one.
    agent-key: ${NOTTRILIX_AGENT_KEY:nottrilix-demo-agent-key}

logging:
  level:
    com.nottrilix: DEBUG
    org.springframework.ai: INFO
