spring:
  application:
    name: nottrilix-agent
  ai:
    openai:
      # Kljuc iz okoline (skripta ga cita iz openai.key). Bez kljuca agent se pokrene, ali na poruke vraca 503.
      api-key: ${OPENAI_API_KEY:not-set}
      chat:
        options:
          model: gpt-4o           # model agenta (tool calling + hrvatski)
          temperature: 0.2
      # Faza 5, glas: prepoznavanje govora (STT) je OpenAI, sinteza (TTS) je ElevenLabs ako je kljuc tu, inace OpenAI
      audio:
        transcription:
          options:
            model: gpt-4o-mini-transcribe
            language: hr
            # Bez prompta model zna ignorirati language i vratiti cirilicu ili poljski; rjecnik domene to rjesava.
            prompt: >-
              Razgovor kupca s podrškom NotTrilix na hrvatskom. Pojmovi: HT bon, A1 bon, Steam Wallet, PlayStation Store,
              Xbox Gift Card, wallet, aktivacijski kod, serijski broj, kupnja, povrat, blokada bona, potvrđujem, odustajem.
        speech:
          options:
            model: gpt-4o-mini-tts
            voice: nova
            response-format: mp3
    elevenlabs:
      api-key: ${ELEVENLABS_API_KEY:not-set}
      tts:
        options:
          model-id: eleven_multilingual_v2
          voice-id: ${NOTTRILIX_VOICE_ID:CwhRBWXzGAHq8TQ4Fs17}
          output-format: mp3_44100_64
    model:
      embedding: none             # agent ne racuna embeddinge: bazu znanja pretrazuje sustav (MCP alat)
      audio:
        speech: ${NOTTRILIX_TTS:openai}   # elevenlabs | openai (skripta stavlja elevenlabs kad postoji elevenlabs.key)
    # Agent je MCP klijent sustava: alati i znanje stizu preko mreze (HTTP, bez sesije)
    mcp:
      client:
        name: nottrilix-agent
        version: 0.4.0
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            nottrilix:
              url: ${NOTTRILIX_SYSTEM_URL:http://localhost:8080}
              endpoint: /mcp
  output:
    ansi:
      enabled: always

server:
  port: 8090

nottrilix:
  voice:
    enabled: true
    max-reply-chars: 600          # dulji odgovor se u govoru rezi (chat i dalje dobiva cijeli tekst)
  agent:
    name: Nola
    max-history-messages: 20      # koliko zadnjih poruka razgovora model vidi
    # Kljuc kojim se agent predstavlja sustavu pri spajanju. Demo vrijednost; ista mora biti u sustavu.
    agent-key: ${NOTTRILIX_AGENT_KEY:nottrilix-demo-agent-key}

logging:
  level:
    com.nottrilix: DEBUG
    org.springframework.ai: INFO
