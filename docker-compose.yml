# NotTrilix 2026 - database. Port 5433 on the host so it does not collide with other local Postgres instances.
# The pgvector image = plain Postgres 17 (the extension is not used in Phase 1; later phases need not change it).
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nottrilix2026-postgres
    environment:
      POSTGRES_DB: nottrilix
      POSTGRES_USER: nottrilix
      POSTGRES_PASSWORD: nottrilix
    ports:
      - "5433:5432"
    volumes:
      - nottrilix2026-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nottrilix -d nottrilix"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  nottrilix2026-pgdata:
